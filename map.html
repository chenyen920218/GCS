<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<title>UAV Live Map</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
 href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

<style>
html, body {
    height: 100%;
    margin: 0;
}
#map {
    width: 100%;
    height: 100%;
}
</style>
</head>
<body>

<div id="map"></div>

<script>
// 初始中心點
var map = L.map('map').setView([25.03, 121.56], 17);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
}).addTo(map);

var marker = L.marker([25.03, 121.56]).addTo(map);
var path = L.polyline([], { color: 'lime' }).addTo(map);

function updateMarker(lat, lon) {
    var ll = [lat, lon];
    marker.setLatLng(ll);
    path.addLatLng(ll);
    map.setView(ll);
}

function clearTrack() {
    path.setLatLngs([]);
}
window.updateMarker = updateMarker;
window.clearTrack = clearTrack;
</script>

</body>
</html>
